services:
  postgres:
    image: postgres:15
    container_name: mingle-postgres
    environment:
      POSTGRES_DB: mingle
      POSTGRES_USER: mingle
      POSTGRES_PASSWORD: mingle_dev
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c log_min_duration_statement=1000
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingle -d mingle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mingle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # LiveKit media server for the blind speed date (dev mode: api key "devkey" / secret "secret").
  # Set LIVEKIT_URL=ws://localhost:7880, LIVEKIT_API_KEY=devkey, LIVEKIT_API_SECRET=secret.
  livekit:
    image: livekit/livekit-server:latest
    container_name: mingle-livekit
    # A single mapped UDP port keeps WebRTC reachable from Android emulators. The emulator's
    # 10.0.2.2 alias points back to the development host, where Docker forwards port 7882.
    command: --dev --bind 0.0.0.0 --node-ip 10.0.2.2 --udp-port 7882
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # ── App services (dev, hot-reload). Enable with the "apps" profile: docker compose --profile apps up ──
  # NestJS API. Applies pending migrations on start, then `nest start --watch`.
  backend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: mingle-backend
    command: sh -c "pnpm --filter @mingle/backend exec prisma migrate deploy && pnpm dev:backend"
    environment:
      DATABASE_URL: postgresql://mingle:mingle_dev@postgres:5432/mingle
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me-at-least-16-chars
      PORT: "3000"
      # Social-only auth dev bypasses (never enable in production).
      DEV_AUTH_ENABLED: "true"
      IDENTITY_DEV_BYPASS: "true"
      # In-container LiveKit (dev mode).
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      # Reliable file-watching over macOS/Windows bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./apps/backend/uploads:/app/apps/backend/uploads

  # Next.js admin/web dashboard.
  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: mingle-web
    command: pnpm dev:web
    environment:
      # Browser calls the host-published backend port.
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3100:3100"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./apps/web/src:/app/apps/web/src

volumes:
  postgres_data:
  redis_data:
