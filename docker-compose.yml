services:
  postgres:
    image: postgres:15
    container_name: mingle-postgres
    environment:
      POSTGRES_DB: mingle
      POSTGRES_USER: mingle
      POSTGRES_PASSWORD: mingle_dev
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c log_min_duration_statement=1000
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mingle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
