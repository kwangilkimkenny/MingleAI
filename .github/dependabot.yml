version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
