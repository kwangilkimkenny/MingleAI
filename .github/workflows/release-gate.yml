name: Release gate

on:
  pull_request:
  push:
    branches:
      - megahuni

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Audit, test, build, and migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mingle
          POSTGRES_PASSWORD: mingle_ci
          POSTGRES_DB: mingle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mingle -d mingle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://mingle:mingle_ci@localhost:5432/mingle_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mingle/backend prisma:generate

      - name: Reject high-severity production vulnerabilities
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply production migrations to a clean database
        run: pnpm --filter @mingle/backend exec prisma migrate deploy

      - name: Confirm migration state
        run: pnpm --filter @mingle/backend exec prisma migrate status

      - name: Validate mobile release configuration
        run: pnpm --filter @mingle/mobile release:validate

      - name: Run Expo project diagnostics
        run: pnpm --dir apps/mobile dlx expo-doctor@1.20.1

      - name: Export Android JavaScript bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.ci.mingles.dev
          EXPO_PUBLIC_KAKAO_CLIENT_ID: ci-public-client-id
        run: pnpm --filter @mingle/mobile exec expo export --platform android --output-dir dist-ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
