<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MingleAI game world HUD reference</title>
  <style>
    :root { --ink:#17150f; --paper:#fff; --coral:#d13f4f; --fill:#f1efe9; --taupe:#736357; --safe:#257a55; }
    * { box-sizing:border-box; }
    body { margin:0; background:#ded9cf; color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; }
    main { min-height:100vh; display:grid; place-items:center; padding:32px; }
    .phone { width:min(940px,100%); aspect-ratio:16/9; min-height:430px; background:#88b985; border:3px solid var(--ink); border-radius:28px; overflow:hidden; position:relative; box-shadow:8px 10px 0 var(--ink); }
    .top { height:64px; background:rgba(255,255,255,.94); border-bottom:2px solid var(--ink); display:flex; align-items:center; gap:12px; padding:8px 14px; }
    .back,.icon,.presence { min-width:44px; height:44px; border:2px solid var(--ink); background:var(--paper); border-radius:16px 12px 18px 14px; display:grid; place-items:center; font-weight:800; }
    .name { flex:1; font-family:cursive; font-size:22px; font-weight:800; }
    .presence { min-width:52px; padding:0 10px; }
    .world { position:absolute; inset:64px 0 0; background-color:#7cae75; background-image:linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px); background-size:32px 32px; }
    .room { position:absolute; inset:58px 120px 80px; border:12px solid #55483b; background:#d8c58e; box-shadow:inset 0 0 0 3px #fff5; }
    .objective { position:absolute; left:14px; top:14px; width:min(420px,56%); padding:10px 13px; background:rgba(255,255,255,.95); border:2px solid var(--ink); border-radius:15px 11px 17px 10px; }
    .eyebrow { display:flex; gap:10px; align-items:center; color:var(--coral); font-size:11px; font-weight:900; letter-spacing:.08em; }
    .safe { color:var(--safe); letter-spacing:0; }
    h1 { font-family:cursive; font-size:20px; margin:3px 0 1px; }
    .objective p { margin:0; color:var(--taupe); font-size:12px; line-height:1.4; }
    .chat { position:absolute; right:16px; top:14px; width:52px; height:52px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:50%; background:var(--paper); font-size:23px; }
    .joystick { position:absolute; left:24px; bottom:22px; width:120px; height:120px; border:2px solid var(--ink); border-radius:50%; background:#fff8; display:grid; place-items:center; }
    .joystick::after { content:""; width:48px; height:48px; background:var(--paper); border:2px solid var(--ink); border-radius:50%; }
    .action { position:absolute; right:24px; bottom:24px; width:80px; height:80px; border:2px solid var(--ink); border-radius:50%; background:var(--paper); display:grid; place-items:center; font-family:cursive; font-size:19px; font-weight:800; }
    .person { position:absolute; width:34px; height:46px; background:var(--coral); border:3px solid var(--ink); border-radius:45% 45% 35% 35%; }
    .p1 { left:45%; top:55%; } .p2 { left:56%; top:44%; background:#6393c6; } .p3 { left:36%; top:39%; background:#e6bb4d; }
    .caption { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); color:#fff; background:#17150fcc; padding:5px 10px; border-radius:8px; font-size:11px; }
  </style>
</head>
<body><main><section class="phone" aria-label="MingleAI game HUD reference">
  <header class="top"><div class="back">←</div><div class="name">오늘의 게임 파티</div><div class="icon">?</div><div class="icon">♙</div><div class="presence">4명</div></header>
  <div class="world"><div class="room"></div><div class="person p1"></div><div class="person p2"></div><div class="person p3"></div>
    <aside class="objective"><div class="eyebrow">지금 할 일 <span class="safe">✓ 안전 연결</span></div><h1>먼저 월드를 둘러보세요</h1><p>왼쪽 조이스틱으로 이동해 멤버나 밸런스 게임 스테이션에 가까이 가보세요.</p></aside>
    <div class="chat">○</div><div class="joystick"></div><div class="action">사용</div><div class="caption">Pixel world × restrained doodle decision layer</div>
  </div>
</section></main></body>
</html>
